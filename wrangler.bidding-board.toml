name = "bidding-board-worker"
main = "workers/bidding-board-worker.js"
compatibility_date = "2025-07-29"

# 北京时间触发：9:15/9:20/9:25/9:26/16:00（周一至周五）
# 9:15 = UTC 01:15, 9:20 = UTC 01:20, 9:25 = UTC 01:25, 9:26 = UTC 01:26, 16:00 = UTC 08:00
[triggers]
crons = [
  "15 1 * * 1-5",
  "20 1 * * 1-5",
  "25 1 * * 1-5",
  "26 1 * * 1-5",
  "0 8 * * 1-5"
]

[vars]
SUPABASE_URL = "https://tonqfgeyxnnwicjopshn.supabase.co"
TZ = "Asia/Shanghai"

# 敏感变量请通过 wrangler secret 设置，不要写在这里：
#   wrangler secret put FUYAO_API_KEY --config wrangler.bidding-board.toml
#   wrangler secret put SUPABASE_ANON_KEY --config wrangler.bidding-board.toml
#   wrangler secret put NUMCAT_API_KEY --config wrangler.bidding-board.toml
#   wrangler secret put FETCH_TOKEN --config wrangler.bidding-board.toml
