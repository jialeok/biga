<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Boards 2/5/6 Vue Test</title>
  <script src="vue.global.prod.js"></script>
  <style>
    .rank-board, .duiban-board, .etf-board { margin: 12px; border: 1px solid #e2e8f0; border-radius: 8px; }
    .rank-header, .duiban-header, .etf-header { padding: 12px; background: #f8fafc; }
    .rank-content, .duiban-content, .etf-content { padding: 12px; }
  </style>
</head>
<body>
  <div class="rank-board trading-day-element" ondblclick="openRankEdit()">
    <div class="rank-header"><div class="rank-title">昨日最大成交额</div></div>
    <div class="rank-content" id="rankContent"></div>
  </div>

  <div class="duiban-board trading-day-element">
    <div class="duiban-header" ondblclick="openDuibanEdit()"><div class="duiban-title">最近多板</div></div>
    <div class="duiban-content" id="duibanContent" ondblclick="openDuibanEdit()"></div>
  </div>

  <div class="etf-board trading-day-element">
    <div class="etf-header" ondblclick="openEtfEdit()" style="cursor:pointer"><div class="etf-title">早盘板块ETF表现</div></div>
    <div class="etf-content" id="etfContent" ondblclick="openEtfEdit()"></div>
  </div>

  <script>
    window.currentDate = '2026-07-28';

    // rank 数据 mock
    var _rankData = {
      '2026-07-28': [
        { stock: '测试A', jitu: '✓', percent: '+5.2', concept: 'AI', turnover: '12.5' },
        { stock: '测试B', jitu: '×', percent: '-1.3', concept: '芯片', turnover: '8.3' }
      ]
    };
    window.getRankData = function () { return _rankData; };
    window.saveData = function () {
      window.__rankSaved = JSON.parse(JSON.stringify(_rankData));
    };

    // auctionStore mock（dashboards.js 需要）
    window.auctionStore = { currentDate: '2026-07-28' };

    // supabase mock（dashboards.js 需要）
    var _supabaseTables = {};
    function ensureTable(name) { if (!_supabaseTables[name]) _supabaseTables[name] = []; return _supabaseTables[name]; }
    window.supabase = {
      createClient: function () {
        return {
          from: function (table) {
            var rows = ensureTable(table);
            return {
              select: function () { return this; },
              eq: function (col, val) { this._filter = { col: col, val: val }; return this; },
              maybeSingle: function () {
                var row = rows.find(function (r) { return r[this._filter.col] === this._filter.val; }.bind(this));
                return Promise.resolve({ data: row || null, error: null });
              },
              upsert: function (data) {
                var idx = rows.findIndex(function (r) { return r.date === data.date; });
                if (idx >= 0) rows[idx] = Object.assign({}, rows[idx], data);
                else rows.push(data);
                return Promise.resolve({ data: data, error: null });
              },
              delete: function () {
                var self = this;
                return { eq: function (col, val) {
                  for (var i = rows.length - 1; i >= 0; i--) if (rows[i][col] === val) rows.splice(i, 1);
                  return Promise.resolve({ data: null, error: null });
                }};
              }
            };
          },
          channel: function () { return { on: function () { return this; }, subscribe: function () {} }; }
        };
      }
    };
  </script>
  <script src="dashboards.js"></script>
  <script src="rank-vue.js"></script>
</body>
</html>
