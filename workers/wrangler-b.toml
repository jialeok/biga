name = "bidding-board-worker-b"
main = "bidding-board-worker-b.js"
compatibility_date = "2025-07-29"

# ⚠️ 重要：wrangler deploy 会用这里的 crons 配置完全覆盖云端定时任务！
# 如果这里 crons 为空，会清空 Dashboard 上手动配的定时任务——这是 7/30 断抓的根因。
# 部署命令：wrangler deploy --config workers/wrangler-b.toml
[triggers]
crons = [
  "25 1 * * 1-5",
  "26 1 * * 1-5",
  "40 1 * * 1-5",
  "0 8 * * 1-5",
]

# 需通过 wrangler secret put 设置：
#   SUPABASE_ANON_KEY
#   FUYAO_API_KEY   # 仅用于交易日历校验；校验失败会自动回退本地日历
#   NUMCAT_API_KEY
#   FETCH_TOKEN
