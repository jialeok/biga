name = "bidding-board-worker-b"
main = "bidding-board-worker-b.js"
compatibility_date = "2026-07-31"

[triggers]
crons = [
  "25 1 * * 1-5",
  "26 1 * * 1-5",
  "40 1 * * 1-5",
  "0 8 * * 1-5",
]

